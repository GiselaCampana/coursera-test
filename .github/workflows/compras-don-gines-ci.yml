name: Compras Don Gines CI

on:
  push:
    branches:
      - compras-don-gines-deploy
      - claude/compras-don-gines-app-xuy4qp
    paths:
      - 'compras-don-gines/**'
      - '.github/workflows/compras-don-gines-ci.yml'
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: compras-don-gines

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public
      AUTH_PROVIDER: local
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./.storage-test
      STORAGE_SIGNING_SECRET: ci-only-secret-do-not-use-in-production
      APP_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compras-don-gines/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Crear base E2E
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='compras_e2e'" | grep -q 1 || \
            psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE compras_e2e"

      - name: Entorno de pruebas
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-test"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          EOF

          cat > .env.e2e <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_e2e?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-e2e"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          EOF

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright de catálogo y asociaciones
        run: |
          node scripts/preparar-e2e.mjs
          npx playwright test tests/e2e/asociaciones.spec.ts tests/e2e/catalogo.spec.ts
