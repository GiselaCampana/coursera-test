name: Compras Don Gines CI

on:
  push:
    branches:
      - compras-don-gines-deploy
      - claude/compras-don-gines-app-xuy4qp
      # La rama candidata: lo que se despliega en la demo pasa por la misma
      # verificación bloqueante que gobierna producción, y no por una más
      # liviana. Una candidata que se verifica distinto no es una candidata.
      - compras-release-candidate
      # La rama del cierre operativo, por la misma razón: lo que va a quedar
      # como Compras terminada se verifica con lo que gobierna producción.
      - compras-cierre-operativo
      # La rama de Stock ERP fase 2. Trae la fase 1 integrada sobre producción,
      # así que lo que hay que verificar no es sólo lo nuevo: es que Compras
      # siga entera con el módulo nuevo adentro.
      - stock-erp-fase-2
      - stock-erp-fase-3
    paths:
      - 'compras-don-gines/**'
      - '.github/workflows/compras-don-gines-ci.yml'
  workflow_dispatch:

concurrency:
  group: compras-don-gines-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: compras-don-gines

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public
      AUTH_PROVIDER: local
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./.storage-test
      STORAGE_SIGNING_SECRET: ci-only-secret-do-not-use-in-production
      APP_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compras-don-gines/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Crear base E2E
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='compras_e2e'" | grep -q 1 || \
            psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE compras_e2e"

      - name: Entorno de pruebas
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-test"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          EOF

          cat > .env.e2e <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_e2e?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-e2e"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          STOCK_CATALOG_URL="http://127.0.0.1:3111/api/integrations/catalog"
          STOCK_INTEGRATION_KEY="clave-de-prueba-e2e-no-es-un-secreto"
          # Qué día es, para el sembrado y para el servidor. Sin esto el estado
          # de un pago depende del día en que corra CI. Ver .env.e2e.
          APP_FAKE_TODAY="2026-09-10"
          EOF

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # Las end to end que corren sobre comprobantes dibujados, que tardan
      # segundos. Las que leen las fotos reales quedan fuera de CI porque cada
      # una lleva minutos de OCR; se corren a mano antes de desplegar.
      - name: Playwright de catálogo, asociaciones y alta de comprobantes
        run: |
          node scripts/preparar-e2e.mjs
          npx playwright test \
            tests/e2e/asociaciones.spec.ts \
            tests/e2e/catalogo.spec.ts \
            tests/e2e/precios.spec.ts \
            tests/e2e/proveedor-nuevo.spec.ts \
            tests/e2e/nota-credito.spec.ts \
            tests/e2e/auditoria-atribucion.spec.ts \
            tests/e2e/marcajes-familia.spec.ts \
            tests/e2e/marcajes-modalidad.spec.ts \
            tests/e2e/stock-sync.spec.ts \
            tests/e2e/carga-manual.spec.ts \
            tests/e2e/stock-erp-unidades.spec.ts \
            tests/e2e/stock-erp-apertura.spec.ts
