# Verificación de la rama de desarrollo del motor general de facturas.
#
# Existe aparte de `compras-don-gines-ci.yml` a propósito: aquél escucha la
# rama de despliegue y es el que gobierna lo que sale a producción. Éste mira
# `motor-general-facturas` y **no despliega nada**: no toca
# `compras-don-gines-deploy`, no publica imágenes y no llama a ningún hook.
#
# Corre además la prueba de la vista previa de la compra, que el otro no corre,
# y la corre en los dos proyectos: el escritorio y el iPhone. La aplicación se
# usa desde el teléfono, así que una pantalla que sólo se probó en 1280 píxeles
# está a medio probar.
name: Vista previa de la compra

on:
  push:
    branches:
      - motor-general-facturas
    paths:
      - 'compras-don-gines/**'
      - '.github/workflows/vista-previa-ci.yml'
  workflow_dispatch:

concurrency:
  group: vista-previa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: compras-don-gines

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public
      AUTH_PROVIDER: local
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./.storage-test
      STORAGE_SIGNING_SECRET: ci-only-secret-do-not-use-in-production
      APP_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compras-don-gines/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Crear base E2E
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='compras_e2e'" | grep -q 1 || \
            psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE compras_e2e"

      - name: Entorno de pruebas
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-test"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          EOF

          cat > .env.e2e <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_e2e?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-e2e"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          STOCK_CATALOG_URL="http://127.0.0.1:3111/api/integrations/catalog"
          STOCK_INTEGRATION_KEY="clave-de-prueba-e2e-no-es-un-secreto"
          EOF

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      # Los dos pasos que siguen corren aunque Vitest haya fallado, y el `if`
      # es deliberado.
      #
      # Hay una prueba de reloj —cada comprobante se reconstruye en menos de un
      # segundo— que mide tiempo de pared y depende de la máquina: en un runner
      # compartido raspa el presupuesto y a veces lo pasa. Encadenada como
      # estaba, esa fluctuación dejaba la cobertura de la vista previa sin
      # correr NI UNA VEZ, que es justamente para lo que existe esta
      # verificación.
      #
      # Esto NO la pone en verde ni la esconde: si Vitest falla, el trabajo
      # falla igual y el error sigue a la vista. Lo único que cambia es que la
      # vista previa también se prueba, en vez de quedar saltada por el reloj
      # de otra prueba.
      - name: Chromium
        if: success() || failure()
        run: npx playwright install --with-deps chromium

      # La vista previa, en el escritorio y en el teléfono. El resto de las end
      # to end las corre la verificación de la rama de despliegue.
      - name: Playwright de la vista previa
        if: success() || failure()
        run: |
          node scripts/preparar-e2e.mjs
          npx playwright test tests/e2e/vista-previa-compra.spec.ts
