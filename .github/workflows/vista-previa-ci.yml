# Verificación de la rama de desarrollo del motor general de facturas.
#
# Existe aparte de `compras-don-gines-ci.yml` a propósito: aquél escucha la
# rama de despliegue y es el que gobierna lo que sale a producción. Éste mira
# `motor-general-facturas` y **no despliega nada**: no toca
# `compras-don-gines-deploy`, no publica imágenes y no llama a ningún hook.
#
# Corre además la prueba de la vista previa de la compra, que el otro no corre,
# y la corre en los dos proyectos: el escritorio y el iPhone. La aplicación se
# usa desde el teléfono, así que una pantalla que sólo se probó en 1280 píxeles
# está a medio probar.
name: Vista previa de la compra

on:
  push:
    branches:
      - motor-general-facturas
    paths:
      - 'compras-don-gines/**'
      - '.github/workflows/vista-previa-ci.yml'
  workflow_dispatch:

concurrency:
  group: vista-previa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compras_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: compras-don-gines

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public
      AUTH_PROVIDER: local
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./.storage-test
      STORAGE_SIGNING_SECRET: ci-only-secret-do-not-use-in-production
      APP_URL: http://127.0.0.1:3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compras-don-gines/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Crear base E2E
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='compras_e2e'" | grep -q 1 || \
            psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE compras_e2e"

      - name: Entorno de pruebas
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_test?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-test"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          EOF

          cat > .env.e2e <<'EOF'
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/compras_e2e?schema=public"
          AUTH_PROVIDER="local"
          STORAGE_DRIVER="local"
          STORAGE_LOCAL_DIR="./.storage-e2e"
          STORAGE_SIGNING_SECRET="ci-only-secret-do-not-use-in-production"
          APP_URL="http://127.0.0.1:3100"
          STOCK_CATALOG_URL="http://127.0.0.1:3111/api/integrations/catalog"
          STOCK_INTEGRATION_KEY="clave-de-prueba-e2e-no-es-un-secreto"
          # Qué día es, para el sembrado y para el servidor. Sin esto el estado
          # de un pago depende del día en que corra CI. Ver .env.e2e.
          APP_FAKE_TODAY="2026-09-10"
          EOF

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test

      # Los dos pasos que siguen corren aunque algo anterior haya fallado.
      # La vista previa se prueba siempre: es lo que esta verificación existe
      # para mirar, y no puede quedar saltada porque falló otra cosa. Si algo
      # falló, el trabajo falla igual: esto no pone nada en verde.
      - name: Chromium
        if: success() || failure()
        run: npx playwright install --with-deps chromium

      # La vista previa, en el escritorio y en el teléfono —los dos proyectos
      # de Playwright—. El resto de las end to end las corre la verificación de
      # la rama de despliegue.
      - name: Playwright de la vista previa
        if: success() || failure()
        run: |
          node scripts/preparar-e2e.mjs
          npx playwright test tests/e2e/vista-previa-compra.spec.ts

  # ---------------------------------------------------------------------------
  # El rendimiento, que informa y no bloquea.
  #
  # Mide tiempo de pared sobre la máquina que le toque, y eso no puede decidir
  # si una lectura correcta cuenta o no: con el motor congelado, el mismo
  # comprobante dio 1.197, 1.264 y 1.297 ms en tres runners distintos. El
  # presupuesto de 1.000 ms no se afloja —es lo que una persona siente cuando
  # carga una factura desde el teléfono—, pero se mira acá.
  #
  # `continue-on-error` hace que su resultado no tiña la corrida. Lo que sí
  # queda es el tiempo publicado renglón por renglón y un aviso visible cuando
  # se pasa. Si empieza a pasarse en todas las máquinas, eso es una regresión
  # de verdad.
  # ---------------------------------------------------------------------------
  rendimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    defaults:
      run:
        working-directory: compras-don-gines

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compras-don-gines/package-lock.json

      - name: Dependencias
        run: npm ci

      # No necesita base: mide sobre la evidencia guardada de las fotos.
      - name: Medición de reconstrucción
        run: npm run test:rendimiento
