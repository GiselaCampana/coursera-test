# Despliegue en Render, plan gratuito.
#
# ESTE ARCHIVO VA EN LA RAÍZ DEL REPOSITORIO, no dentro de compras-don-gines/.
# Render busca el blueprint en la raíz y sólo ahí; si está en una subcarpeta no
# lo encuentra y el servicio hay que configurarlo a mano. La aplicación sí vive
# en la subcarpeta, y eso lo resuelve `rootDir` más abajo.
#
# Este archivo describe el servicio; no crea ninguna cuenta ni contrata nada.
# El plan `free` es el único que se declara: Render no sube de plan solo, y sin
# tarjeta cargada no puede generar cargos.
#
# La base de datos y el almacenamiento NO están acá a propósito: van en el
# proyecto gratuito de Supabase, y sus credenciales se cargan a mano en el panel
# de Render. Declarar una base de Render habría creado un PostgreSQL que se
# borra a los 30 días.
services:
  - type: web
    name: compras-don-gines
    runtime: node
    plan: free
    region: oregon
    rootDir: compras-don-gines
    # `--include=dev` no es opcional. Con NODE_ENV=production —que hace falta en
    # runtime— npm omite las devDependencies, y ahí viven cosas que se necesitan
    # para *compilar*: typescript y los @types que Next usa para chequear tipos,
    # y el CLI de prisma que corre las migraciones y genera el cliente.
    #
    # Sin esto, Next detecta que faltan los @types e intenta instalarlos solo a
    # mitad del build. Cuando esa instalación no prospera, el worker muere con
    # "Next.js build worker exited with code: 1" y el mensaje sobre tsconfig.json,
    # que no dice en ningún lado que el problema son las dependencias omitidas.
    #
    # `migrate deploy` aplica las migraciones pendientes sin borrar nada, y va
    # antes del build para que el código nuevo encuentre el esquema nuevo.
    #
    # `db:seed` va acá porque el plan gratuito de Render no da consola: no hay
    # forma de correr un comando suelto contra la base de producción. El seed
    # es idempotente y no destructivo —crea sólo lo que falta, con findUnique +
    # create, y no pisa nada de lo que se haya editado desde la aplicación—, así
    # que correrlo en cada despliegue es inofensivo. NO es `migrate reset`: no
    # borra ni una fila.
    #
    # El build copia además los archivos del lector a public/ocr/.
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run db:seed && npm run build
    startCommand: npm run start
    # Un endpoint propio, público, que no toca cookies, sesión, base ni ninguna
    # pantalla: contesta 200 si el proceso está vivo, que es lo único que este
    # chequeo tiene que averiguar.
    #
    # Antes apuntaba a /ingresar. Aunque esa pantalla es pública, sigue siendo
    # una pantalla —pasa por React, lee cookies, puede redirigir—, así que
    # cualquier cambio ahí se volvía sin querer un requisito para que el
    # despliegue terminara. Tampoco consulta la base: si lo hiciera, un rato de
    # Supabase caído no dejaría la aplicación degradada sino reiniciándose en
    # loop, porque Render mata lo que no pasa el chequeo.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20.11.0'

      # --- Supabase: base, almacenamiento y contraseñas --------------------
      # Se cargan a mano en el panel de Render (Environment). Ninguna va acá:
      # este archivo se versiona y las credenciales no se versionan nunca.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      # Clave pública del proyecto (sb_publishable_… o la "anon" de antes).
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Clave secreta (sb_secret_… o la "service_role" de antes). Saltea todas
      # las políticas de seguridad: sólo del lado del servidor, nunca en el
      # repositorio ni en una variable NEXT_PUBLIC_.
      - key: SUPABASE_SECRET_KEY
        sync: false

      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_BUCKET
        value: comprobantes
      # 1 GB, que es lo que da el plan gratuito de Supabase. La aplicación avisa
      # al 80 % y bloquea al 95 %, antes de que el proveedor rechace nada.
      - key: STORAGE_LIMIT_BYTES
        value: '1073741824'

      # --- Autenticación ---------------------------------------------------
      # Se deja en `local` hasta confirmar que el ingreso por Supabase funciona
      # con un usuario real. Cambiarlo a `supabase` es una edición en el panel.
      - key: AUTH_PROVIDER
        value: local

      # --- Usuario administrador inicial ------------------------------------
      # Los toma el seed la primera vez que corre, para crear el administrador.
      # Si el usuario ya existe no se toca: cambiar estas variables después NO
      # cambia ninguna contraseña.
      #
      # La contraseña sirve para entrar una sola vez: la aplicación exige
      # cambiarla antes de dejar usar ninguna pantalla, porque una contraseña
      # guardada en este panel la ve cualquiera que entre acá.
      #
      # Mínimo 10 caracteres combinando letras y números, o el seed falla.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      #
      # Los tres operadores de sucursal se crean igual, con una contraseña al
      # azar que el seed imprime en el log del build. Si se prefiere elegirla,
      # se agrega SEED_OPERATOR_PASSWORD al panel *y a este archivo*: una
      # variable que esté sólo en el panel se pierde en la próxima
      # sincronización del blueprint.

      # --- Seguridad -------------------------------------------------------
      # generateValue crea un secreto al azar la primera vez y lo conserva.
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: APP_URL
        sync: false

      # --- Lectura de comprobantes ----------------------------------------
      # Sin claves: el OCR corre en el teléfono con Tesseract.
      - key: OCR_MAX_ATTEMPTS
        value: '3'
      - key: MAX_FILES_PER_DOCUMENT
        value: '10'
      - key: MAX_UPLOAD_BYTES
        value: '26214400'
